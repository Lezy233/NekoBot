services:
  nekobot:
    build:
      context: .
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      CHAT_PERSONA_PATH: persona/default.local.md
    volumes:
      - ./data:/app/data
      - ./persona:/app/persona:ro
      - ./stickers:/app/stickers:ro
    ports:
      - "127.0.0.1:8080:8080"
